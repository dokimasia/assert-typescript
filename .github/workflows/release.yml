name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate runs again here rather than trusting the CI run on the
  # commit. A tag can point at anything, and a published version can
  # never be taken back.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run coverage

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted publishing: npm verifies this workflow's identity, so
      # no long-lived token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build

      # A tag that disagrees with package.json would publish a version
      # nobody asked for, under a number that can never be reused.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          packaged=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME carries $tagged, package.json says $packaged"
            exit 1
          fi
          echo "tag and package.json agree on $packaged"

      - run: npm publish --provenance --access public
