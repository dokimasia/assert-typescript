name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor package.json declares, and every version since. A
        # library runs on whatever its consumers run.
        node-version: ["24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Types
        run: npm run types

      # Before the tests, not after: the README's API reference is
      # generated from the emitted declarations, and the test that
      # holds the README to the code reads them.
      - name: Build
        run: npm run build

      - name: Tests and coverage
        run: npm run coverage

      - name: Check the build ships no .ts specifiers
        run: |
          if grep -rn '\.ts"' --include='*.js' --include='*.d.ts' dist/; then
            echo "dist names .ts files, which the package does not ship"
            exit 1
          fi
          echo "dist names only .js"

      - name: Check the package installs and imports
        run: |
          npm pack --silent
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y --silent >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/dokimi-assert-*.tgz
          node --input-type=module -e "
            import { check, soft } from '@dokimi/assert';
            import { Recorder } from '@dokimi/assert';
            const seat = new Recorder();
            check.equal(seat, 1, 2, 'the package works');
            if (!seat.failed) { throw new Error('the assertion reported nothing'); }
            console.log('installed and imported:', seat.message);
          "

  # The vendored definition is what this library is held to, and a copy
  # nobody checked is a copy that can drift. This fails on a copy that
  # does not match the manifest beside it, and reports without failing
  # when the definition has moved on: lagging is allowed, not knowing
  # is not.
  # The vendored definition is what this library is held to. A copy that
  # does not match the manifest beside it fails, always. A copy that
  # differs from upstream only fails when this change is the one that
  # touched it: falling behind is allowed and is tracked by an issue,
  # but committing a copy nobody else has is not.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did this change touch the vendored copy?
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "strict=" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- src/conformance/spec | grep -q .; then
            echo "strict=--strict" >> "$GITHUB_OUTPUT"
          else
            echo "strict=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the vendored definition
        run: ./tools/spec-check.sh src/conformance/spec ${{ steps.touched.outputs.strict }}
